name: logHooks
version: 0.2.0
description: "log's hooks for Hermes. Before each model call, pre_llm_call puts the play the prompt asks for, pending inbox messages and browser states in front of the model, after each log tool transform_tool_result adds the messages that landed while it ran so a stale draft is steered before the next send, and a message the account watchers hear between turns starts a turn in that chat through ctx.inject_message (needs plugins.entries.logHooks.allow_gateway_injection: true). Written from src/agentHooks/registry (bun run check:agentHooks --write)."
provides_hooks:
  - pre_llm_call
  - transform_tool_result
