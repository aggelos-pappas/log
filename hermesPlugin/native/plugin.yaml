name: logHooks
version: 0.2.0
description: "log's hooks for Hermes. pre_llm_call puts the play the prompt asks for, names it resolves, pending inbox messages and browser states in front of the model; pre_tool_call refuses a script that parses log output and names the flag that narrows it; post_llm_call times the turn. Written from src/agentHooks/registry (bun run check:agentHooks --write)."
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - post_llm_call
